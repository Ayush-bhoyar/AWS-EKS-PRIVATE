name: Terraform Apply (ChatOps Approval)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_VERSION: "1.9.5"
  TF_WORKING_DIR: terraform
  AWS_REGION: us-east-1
  CONFTEST_VERSION: "0.55.0"

jobs:
  apply:
    name: Verify approval & apply
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/terraform-apply')
    runs-on: ubuntu-latest
    steps:
      - name: Verify commenter has write/admin access
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            const allowed = ['admin', 'write'].includes(data.permission);
            if (!allowed) {
              core.setFailed(`@${context.payload.comment.user.login} does not have permission to approve applies (has: ${data.permission}). Only collaborators with write/admin access can approve.`);
            }

      - name: Acknowledge comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Get PR head SHA
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('sha', pr.data.head.sha);

      - name: Checkout PR branch (pinned to reviewed commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      # Download the SAME plan file that was reviewed in the PR comment,
      # rather than re-planning. If the backend state drifted since the plan
      # was generated, `terraform apply` on a stale plan fails safely instead
      # of silently applying something nobody reviewed.
      - name: Download reviewed plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.event.issue.number }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Install Conftest
        run: |
          curl -sL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" | tar xz
          sudo mv conftest /usr/local/bin/conftest

      - name: Re-run policy check as final gate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: conftest test tfplan.json --policy ../policy -o table

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan.binary

      - name: Comment result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = "${{ job.status }}";
            const icon = status === 'success' ? '✅' : '❌';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${icon} Terraform apply (${status}) — approved by @${context.payload.comment.user.login}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
